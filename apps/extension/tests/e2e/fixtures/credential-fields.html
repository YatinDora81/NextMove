<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Staff Engineer — Marlowe Freight</title>
  </head>
  <body>
    <!--
      A form that mixes application fields with the three shapes NextMove must never mention: a
      password (account creation is bolted onto the application on several ATS), a one-time code, and
      payment-card fields. Invented employer, invented fields, no real endpoint.
    -->
    <main>
      <h1>Apply — Staff Engineer</h1>
      <form id="application" action="#" method="post" novalidate>
        <fieldset>
          <legend>About you</legend>
          <p>
            <label for="applicant-first">First name</label>
            <input type="text" id="applicant-first" name="applicant_first" autocomplete="given-name" />
          </p>
          <p>
            <label for="applicant-email">Email address</label>
            <input type="email" id="applicant-email" name="applicant_email" autocomplete="email" />
          </p>
        </fieldset>

        <fieldset>
          <legend>Create your candidate account</legend>
          <p>
            <label for="account-password">Choose a password</label>
            <input type="password" id="account-password" name="account_password" autocomplete="new-password" />
          </p>
          <p>
            <label for="account-otp">Verification code we just emailed you</label>
            <input type="text" id="account-otp" name="account_otp" autocomplete="one-time-code" inputmode="numeric" />
          </p>
        </fieldset>

        <fieldset>
          <legend>Background check fee</legend>
          <p>
            <label for="card-number">Card number</label>
            <input type="text" id="card-number" name="card_number" autocomplete="cc-number" inputmode="numeric" />
          </p>
          <p>
            <label for="card-csc">Security code</label>
            <input type="text" id="card-csc" name="card_cvv" autocomplete="cc-csc" inputmode="numeric" />
          </p>
        </fieldset>

        <p><button type="submit" id="send-application">Send application</button></p>
      </form>
    </main>
  </body>
</html>
