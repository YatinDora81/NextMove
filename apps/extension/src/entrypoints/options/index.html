<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Declared here as well as in app.css so the browser paints the correct canvas in the frame
      before the stylesheet lands. Without it a dark-mode user gets a white flash on every open of
      the Options page, which reads as a broken extension rather than a slow one.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>NextMove Autofill — Options</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
