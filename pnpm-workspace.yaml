packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency lifecycle scripts by default. @prisma/client's `postinstall` is what
# generates `.prisma/client`; without it `import { PrismaClient } from '@prisma/client'` does not
# typecheck, so @repo/db, http-server and web all fail `check-types` on a clean checkout.
# Verified by deleting the generated client and running `turbo run check-types --force`:
#   packages/db/src/index.ts(1,10): error TS2305: Module '"@prisma/client"' has no exported member 'PrismaClient'
onlyBuiltDependencies:
  - "@prisma/client"
  - prisma
